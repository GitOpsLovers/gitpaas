name: PR Labeler

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    name: Apply kind label
    runs-on: ubuntu-latest
    steps:
      - name: Label pull request from its branch type
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
