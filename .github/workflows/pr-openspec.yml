name: PR OpenSpec

on:
  pull_request:
    branches:
      - main
    paths:
      - 'openspec/**'
      - '.github/workflows/pr-openspec.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenSpec artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.1.0

      - name: Validate changes and specs
        run: npx --yes @fission-ai/openspec@1.9.0 validate --all --no-interactive
