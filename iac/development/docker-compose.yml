# Local development stack.
#
# GitPaaS runs everything on ONE machine: the backend (running on this host with
# `pnpm dev`) drives the LOCAL Docker daemon through /var/run/docker.sock, so
# everything it deploys lands on your own Docker. There is no emulated remote
# server here — this stack only provides the backend's own data stores + UIs.
#
# - postgres: the application's own database, where GitPaaS persists its
#             operations (projects, deployments, ...).
# - pgadmin:  a web UI to inspect and query the local postgres. Reachable at
#             http://127.0.0.1:5050 (login admin@gitpaas.dev / gitpaas);
#             the local database server is pre-registered via pgadmin/servers.json.
# - redis:    in-memory store used to buffer and fan-out real-time deployment logs.
#             The backend RPUSHes captured `docker-compose up` output here and streams
#             it to the browser over SSE. In production this same store runs on the server.
# - redisinsight: a web UI to inspect the local Redis. Reachable at
#             http://127.0.0.1:5540; the local redis server is pre-connected via
#             RI_REDIS_* env vars, so it opens ready-to-browse with no login.
#
# Paths are relative to this file (iac/development/).
name: gitpaas-dev

services:
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpaas
      POSTGRES_PASSWORD: gitpaas
      POSTGRES_DB: gitpaas_db
    ports:
      - "127.0.0.1:5432:5432" # backend (on host) connects here
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpaas -d gitpaas_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine3.23
    container_name: gitpaas-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # backend (on host) connects here
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: elestio/pgadmin:REL-9_16
    container_name: gitpaas-pgadmin
    restart: unless-stopped
    environment:
      # pgAdmin rejects special-use TLDs like `.local`, so use a normal domain.
      PGADMIN_DEFAULT_EMAIL: admin@gitpaas.dev
      PGADMIN_DEFAULT_PASSWORD: gitpaas
      # Desktop mode: skip the login screen and master-password prompt for local dev.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80" # web UI — open http://127.0.0.1:5050
    volumes:
      # Pre-register the local postgres server (connects to the `postgres` service).
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:3.6
    container_name: gitpaas-redis-insight
    restart: unless-stopped
    environment:
      # Pre-register the local redis server so the UI opens ready-to-browse.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "GitPaaS (local)"
    ports:
      - "127.0.0.1:5540:5540" # web UI — open http://127.0.0.1:5540
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
