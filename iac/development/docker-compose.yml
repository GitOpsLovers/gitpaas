# Local development stack.
#
# GitPaaS runs everything on ONE machine: the backend (running on this host with
# `pnpm dev`) drives the LOCAL Docker daemon through /var/run/docker.sock, so
# everything it deploys lands on your own Docker. There is no emulated remote
# server here — this stack only provides the backend's own data stores + UIs.
#
# - postgres: the application's own database, where GitPaaS persists its
#             operations (projects, deployments, ...).
# - redis:    the hot store for the live deployment logs. A run's output lives
#             in a Redis stream while it lasts; postgres keeps the archive.
# - pgadmin:  a web UI to inspect and query the local postgres. Reachable at
#             http://127.0.0.1:5050 (login admin@gitpaas.dev / gitpaas);
#             the local database server is pre-registered via pgadmin/servers.json.
# - redisinsight: a web UI to inspect and query the local redis. Reachable at
#             http://127.0.0.1:5540; the local redis is pre-registered via
#             redisinsight/databases.json.
#
# Paths are relative to this file (iac/development/).
name: gitpaas-dev

services:
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpaas
      POSTGRES_PASSWORD: gitpaas
      POSTGRES_DB: gitpaas_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpaas -d gitpaas_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: gitpaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: elestio/pgadmin:REL-9_16
    container_name: gitpaas-pgadmin
    restart: unless-stopped
    environment:
      # pgAdmin rejects special-use TLDs like `.local`, so use a normal domain.
      PGADMIN_DEFAULT_EMAIL: admin@gitpaas.dev
      PGADMIN_DEFAULT_PASSWORD: gitpaas
      # Desktop mode: skip the login screen and master-password prompt for local dev.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80" # web UI — open http://127.0.0.1:5050
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: gitpaas-redisinsight
    restart: unless-stopped
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_PRE_SETUP_DATABASES_PATH: /pre-setup/databases.json
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - ./redisinsight/databases.json:/pre-setup/databases.json:ro
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  redisinsight-data:
