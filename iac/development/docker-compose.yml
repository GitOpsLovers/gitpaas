# Local development stack.
#
# GitPaaS runs everything on ONE machine: the backend (running on this host with
# `pnpm run dev`) drives the LOCAL Docker daemon through /var/run/docker.sock, so
# everything it deploys lands on your own Docker.
#
# - proxy:    the local Traefik. It listens on http://127.0.0.1:80 and routes
#             every host of `*.localhost` that a labelled container claims. Its
#             dashboard sits at http://traefik.localhost.
# - whoami:   the probe of the routing, at http://whoami.localhost.
# - postgres: the application's own database, where GitPaaS persists its
#             operations (projects, deployments, ...).
# - redis:    the hot store for the live deployment logs. A run's output lives
#             in a Redis stream while it lasts; postgres keeps the archive.
# - pgadmin:  a web UI to inspect and query the local postgres. Reachable at
#             http://127.0.0.1:5050 (login admin@gitpaas.dev / gitpaas);
#             the local database server is pre-registered via pgadmin/servers.json.
# - redisinsight: a web UI to inspect and query the local redis. Reachable at
#             http://127.0.0.1:5540; the local redis is pre-registered via
#             redisinsight/databases.json.
#
# Paths are relative to this file (iac/development/).
name: gitpaas-dev

services:
  # Reverse proxy
  proxy:
    image: traefik:v3.7.11
    container_name: gitpaas-proxy
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=gitpaas-proxy"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"

  # Probe of the routing.
  whoami:
    image: traefik/whoami:v1.11
    container_name: gitpaas-whoami
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    depends_on:
      - proxy

  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpaas
      POSTGRES_PASSWORD: gitpaas
      POSTGRES_DB: gitpaas_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpaas -d gitpaas_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: gitpaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pgadmin:
    image: elestio/pgadmin:REL-9_16
    container_name: gitpaas-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gitpaas.dev
      PGADMIN_DEFAULT_PASSWORD: gitpaas
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: gitpaas-redisinsight
    restart: unless-stopped
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_PRE_SETUP_DATABASES_PATH: /pre-setup/databases.json
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - ./redisinsight/databases.json:/pre-setup/databases.json:ro
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

networks:
  # The network that every routed stack joins.
  proxy:
    name: gitpaas-proxy

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  redisinsight-data:
