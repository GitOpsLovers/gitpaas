name: gitpaas

services:
  # Reverse proxy
  proxy:
    image: traefik:v3.7.11
    container_name: gitpaas-proxy
    restart: unless-stopped
    user: "1000:1000"
    cap_add:
      - NET_BIND_SERVICE
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=gitpaas-proxy"
      # The two entrypoints of the server
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # The resolver of Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-acme:/acme
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the host docker group id (getent group docker | cut -d: -f3)}"
    networks:
      - proxy

  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: gitpaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Backend
  backend:
    image: ghcr.io/gitopslovers/gitpaas-backend:${IMAGE_TAG:-latest}
    container_name: gitpaas-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3000}:${PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - proxy-acme:/acme:ro
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the host docker group id (getent group docker | cut -d: -f3)}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Frontend
  frontend:
    image: ghcr.io/gitopslovers/gitpaas-frontend:${IMAGE_TAG:-latest}
    container_name: gitpaas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=${CONTROL_PLANE_PROXY:-false}"
      - "traefik.http.services.gitpaas.loadbalancer.server.port=8080"
      - "traefik.http.routers.gitpaas.rule=Host(`${CONTROL_PLANE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gitpaas.entrypoints=websecure"
      - "traefik.http.routers.gitpaas.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gitpaas.service=gitpaas"
      - "traefik.http.routers.gitpaas-http.rule=Host(`${CONTROL_PLANE_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gitpaas-http.entrypoints=web"
      - "traefik.http.routers.gitpaas-http.middlewares=gitpaas-https"
      - "traefik.http.routers.gitpaas-http.service=gitpaas"
      - "traefik.http.middlewares.gitpaas-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gitpaas-https.redirectscheme.permanent=true"
    depends_on:
      - backend

networks:
  # The network that every stack of a user joins to become reachable
  proxy:
    name: gitpaas-proxy

volumes:
  postgres-data:
  redis-data:
  proxy-acme:
