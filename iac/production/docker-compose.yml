# Production control-plane stack for GitPaaS.
#
# Brings up GitPaaS itself (the control plane) on a server: the NestJS backend,
# the Angular frontend (static SPA served by nginx), and the backend's own data
# stores (PostgreSQL for everything durable, Redis for the live deployment logs
# while a run lasts). This is the app that RUNS deployments; the apps it
# deploys run on the SAME server, on the local Docker daemon the backend reaches
# through the bind-mounted /var/run/docker.sock.
#
# This stack intentionally does NOT include a reverse proxy / TLS termination —
# that is Phase 2 of the deployment roadmap. Host ports are published directly.
#
# Usage:
#   cp .env.example .env        # then fill in secrets (JWT, GitHub App, DB pass)
#   docker compose -f iac/production/docker-compose.yml up -d --build
#
# All configuration is environment-driven; copy .env.example to .env (auto-loaded
# by compose from this directory) and edit it. Never commit a real .env.
name: gitpaas

services:
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: gitpaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: gitpaas-backend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: iac/production/backend.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26.1.0}
        PNPM_VERSION: ${PNPM_VERSION:-11.1.3}
    container_name: gitpaas-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3000}:${PORT:-3000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the host docker group id (getent group docker | cut -d: -f3)}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: gitpaas-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: iac/production/frontend.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26.1.0}
        PNPM_VERSION: ${PNPM_VERSION:-11.1.3}
    container_name: gitpaas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
