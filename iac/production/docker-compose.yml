# Production control-plane stack for GitPaaS.
#
# Brings up GitPaaS itself (the control plane) on a server: the NestJS backend,
# the Angular frontend (static SPA served by nginx), and the backend's own data
# store (PostgreSQL). This is the app that RUNS deployments; the apps it
# deploys run on the SAME server, on the local Docker daemon the backend reaches
# through the bind-mounted /var/run/docker.sock.
#
# This stack intentionally does NOT include a reverse proxy / TLS termination —
# that is Phase 2 of the deployment roadmap. Host ports are published directly.
#
# Usage:
#   cp .env.example .env        # then fill in secrets (JWT, GitHub App, DB pass)
#   docker compose -f iac/production/docker-compose.yml up -d --build
#
# All configuration is environment-driven; copy .env.example to .env (auto-loaded
# by compose from this directory) and edit it. Never commit a real .env.
name: gitpaas

services:
  postgres:
    image: postgres:17.6-alpine3.22
    container_name: gitpaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: gitpaas-backend:${IMAGE_TAG:-latest}
    build:
      # Build context is the repo root so the workspace lockfile/manifests are
      # visible to the multi-stage build.
      context: ../..
      dockerfile: iac/production/backend.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26.1.0}
        PNPM_VERSION: ${PNPM_VERSION:-11.1.3}
    container_name: gitpaas-backend
    restart: unless-stopped
    # The backend reads its full configuration (DB/JWT/GitHub App) from the
    # environment. env_file loads .env verbatim; unknown keys (e.g. POSTGRES_*)
    # are ignored by the app's env validation.
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-3000}:${PORT:-3000}"
    volumes:
      # The local Docker daemon socket: GitPaaS runs deployed apps on THIS server,
      # so the backend drives the host daemon directly through this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as the non-root `node` user, which can only use that socket
    # if it belongs to the group owning it. DOCKER_GID is the host's docker group
    # id (the installer detects and writes it; see .env.example).
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the host docker group id (getent group docker | cut -d: -f3)}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: gitpaas-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: iac/production/frontend.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-26.1.0}
        PNPM_VERSION: ${PNPM_VERSION:-11.1.3}
    container_name: gitpaas-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
