@if (loading()) {
    <app-component-card
        title="Provider details"
        desc="Register the GitHub App the services of this installation deploy through."
    >
        <div class="flex flex-col gap-6">
            <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">
                @for (field of skeletonFields; track field) {
                    <div class="flex flex-col gap-2">
                        <app-skeleton variant="text" className="max-w-24" />
                        <app-skeleton variant="row" />
                    </div>
                }
            </div>
            <div class="flex flex-col gap-2">
                <app-skeleton variant="text" className="max-w-40" />
                <app-skeleton variant="card" />
            </div>
            <app-skeleton variant="row" className="max-w-40" />
        </div>
    </app-component-card>
} @else {
    <app-provider-form
        [initialName]="initialName()"
        [initialAppId]="initialAppId()"
        [initialInstallationId]="initialInstallationId()"
        [keyOptional]="true"
        submitLabel="Save changes"
        [submitting]="submitting()"
        (save)="update($event)"
    />
}
