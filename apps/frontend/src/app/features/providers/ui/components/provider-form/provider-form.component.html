<app-component-card
    title="Provider details"
    desc="Register the GitHub App the services of this installation deploy through."
>
    <form (submit)="onSubmit($event)" class="space-y-6">
        <div>
            <app-label for="provider-name">Name</app-label>
            <app-input-field
                id="provider-name"
                name="provider-name"
                placeholder="acme-github"
                [value]="name()"
                (valueChange)="onNameChange($event)"
            />
        </div>

        <div>
            <app-label for="provider-app-id">App ID</app-label>
            <app-input-field
                id="provider-app-id"
                name="provider-app-id"
                placeholder="123456"
                [value]="appId()"
                (valueChange)="onAppIdChange($event)"
            />
        </div>

        <div>
            <app-label for="provider-installation-id">Installation ID</app-label>
            <app-input-field
                id="provider-installation-id"
                name="provider-installation-id"
                placeholder="98765432"
                [value]="installationId()"
                (valueChange)="onInstallationIdChange($event)"
            />
        </div>

        <div>
            <app-label for="provider-private-key">Private key (PEM)</app-label>
            <textarea
                id="provider-private-key"
                name="provider-private-key"
                rows="8"
                placeholder="-----BEGIN RSA PRIVATE KEY-----"
                class="w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 font-mono text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                [value]="privateKey()"
                (input)="onPrivateKeyChange($event)"
            ></textarea>
            <p class="mt-1.5 text-xs text-gray-500">{{ keyHint() }}</p>
        </div>

        <div class="flex gap-3">
            <app-button type="submit" [disabled]="submitting() || !valid()">
                {{ submitLabel() }}
            </app-button>
            <a
                routerLink="/providers"
                class="inline-flex items-center justify-center gap-2 rounded-lg px-5 py-3.5 text-sm transition bg-white text-gray-700 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-400 dark:ring-gray-700 dark:hover:bg-white/[0.03] dark:hover:text-gray-300"
            >
                Cancel
            </a>
        </div>
    </form>
</app-component-card>
