<app-component-card title="Service details">
    <form (submit)="onSubmit($event)" class="space-y-6">
        <div>
            <app-label for="service-name">Name</app-label>
            <app-input-field
                id="service-name"
                name="service-name"
                placeholder="my-service"
                [value]="name()"
                (valueChange)="onNameChange($event)"
            />
        </div>

        <div>
            <app-label for="service-description">Description</app-label>
            <textarea
                id="service-description"
                name="service-description"
                rows="3"
                [attr.maxlength]="descriptionMaxLength"
                placeholder="What this service does"
                class="w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                [value]="description()"
                (input)="onDescriptionChange($event)"
            ></textarea>
            <p class="mt-1.5 text-xs text-gray-500">
                Optional. {{ description().length }} of {{ descriptionMaxLength }} characters.
            </p>
        </div>

        <div class="flex gap-3">
            <app-button type="submit" [disabled]="submitting() || !name().trim()">
                {{ submitLabel() }}
            </app-button>
            <a
                [routerLink]="['/namespaces', namespaceId(), 'projects', projectId()]"
                class="inline-flex items-center justify-center gap-2 rounded-lg px-5 py-3.5 text-sm transition bg-white text-gray-700 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-400 dark:ring-gray-700 dark:hover:bg-white/[0.03] dark:hover:text-gray-300"
            >
                Cancel
            </a>
        </div>
    </form>
</app-component-card>
