<app-component-card title="Logs" desc="Runtime output from this service's containers.">
    <div card-action class="flex items-center gap-3">
        @if (streaming()) {
            <span class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
                <svg lucideLoaderCircle class="h-3.5 w-3.5 animate-spin"></svg>
                Live
            </span>
        }

        <button
            type="button"
            name="download-logs"
            class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 text-gray-500 transition-colors hover:bg-gray-50 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-white"
            aria-label="Download log output"
            [disabled]="lines().length === 0"
            (click)="download()"
        >
            <svg lucideDownload class="h-4 w-4"></svg>
        </button>
    </div>

    <div class="flex flex-wrap items-center gap-3">
        <div class="w-full sm:w-72">
            <app-select2
                [options]="containerOptions()"
                [value]="selectedContainer()"
                [disabled]="containerOptions().length === 0"
                placeholder="Select a container…"
                searchPlaceholder="Search containers…"
                (valueChange)="containerSelected.emit($event)"
            />
        </div>

        <div class="w-full sm:w-40">
            <app-select2
                [options]="tailOptions"
                [value]="selectedTail()"
                placeholder="Lines"
                searchPlaceholder="Search…"
                (valueChange)="selectTail($event)"
            />
        </div>
    </div>

    <app-log-viewer
        [lines]="viewerLines()"
        [emptyMessage]="emptyMessage()"
        [loading]="loading()"
        ariaLabel="Runtime log output"
    />
</app-component-card>
