<app-breadcrumb [items]="breadcrumb()" />

<app-tabs [tabs]="tabs" [activeId]="activeTab()" (activeIdChange)="changeTab($any($event))" />

<div class="mt-6">
    @switch (activeTab()) {
        @case ('general') {
            <app-service-deploy-actions class="mb-6 block" [deploying]="deploying()" (deploy)="deploy()" />
        }

        @case ('provider') {
            <app-service-provider
                [initial]="providerSettings()"
                [saving]="savingProvider()"
                (save)="saveProvider($event)"
            />
        }

        @case ('configuration') {
            <app-service-variables
                [variables]="variables.value() ?? []"
                [loading]="variables.isLoading()"
                [saving]="savingVariable()"
                [error]="variableError()"
                (set)="setVariable($event)"
                (update)="changeVariable($event)"
                (remove)="requestVariableRemoval($event)"
            />
        }

        @case ('deployments') {
            <app-service-deployments
                [deployments]="deployments.value() ?? []"
                [loading]="deployments.isLoading()"
                [deploying]="deploying()"
                (deploy)="deploy()"
                (view)="viewDeployment($event)"
                (delete)="deleteDeployment($event)"
            />
        }

        @case ('containers') {
            <app-service-containers [containers]="containers.value() ?? []" [loading]="containers.isLoading()" />
        }

        @case ('network') {
            <app-service-networks [networks]="networks.value() ?? []" [loading]="networks.isLoading()" />
        }

        @case ('logs') {
            <app-service-logs />
        }
    }
</div>

<app-confirm-modal
    [open]="pendingVariableRemoval() !== null"
    [message]="removeVariableMessage()"
    [loading]="removingVariable()"
    title="Remove variable?"
    confirmText="Remove"
    cancelText="Cancel"
    variant="danger"
    icon="trash"
    (confirmed)="confirmVariableRemoval()"
    (cancelled)="pendingVariableRemoval.set(null)"
/>

<app-deployment-logs-modal
    [open]="logModalOpen()"
    [deployment]="selectedDeployment()"
    (closed)="logModalOpen.set(false)"
    (finished)="deployments.reload()"
/>
