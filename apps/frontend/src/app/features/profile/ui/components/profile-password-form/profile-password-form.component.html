<section>
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Password</h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">The change closes every other session of this account.</p>

    <form class="mt-5 space-y-6" (submit)="onSubmit($event)">
        <div class="max-w-md">
            <app-label for="profile-current-password">Current password</app-label>
            <app-input-field
                id="profile-current-password"
                name="profile-current-password"
                type="password"
                [value]="currentPassword()"
                [disabled]="saving()"
                (valueChange)="onCurrentPasswordChange($event)"
            />
        </div>

        <div class="max-w-md">
            <app-label for="profile-new-password">New password</app-label>
            <app-input-field
                id="profile-new-password"
                name="profile-new-password"
                type="password"
                [value]="newPassword()"
                [disabled]="saving()"
                [error]="lengthError() !== null"
                [hint]="lengthError() ?? 'At least ' + minLength + ' characters.'"
                (valueChange)="onNewPasswordChange($event)"
            />
        </div>

        <div class="max-w-md">
            <app-label for="profile-password-confirmation">Repeat the new password</app-label>
            <app-input-field
                id="profile-password-confirmation"
                name="profile-password-confirmation"
                type="password"
                [value]="confirmation()"
                [disabled]="saving()"
                [error]="confirmationError() !== null"
                [hint]="confirmationError() ?? undefined"
                (valueChange)="onConfirmationChange($event)"
            />
        </div>

        @if (error(); as message) {
            <p
                class="rounded-lg border border-error-200 bg-error-50 p-4 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-500"
            >
                {{ message }}
            </p>
        }

        <app-button type="submit" [disabled]="saving() || !complete()">
            {{ saving() ? 'Saving…' : 'Change password' }}
        </app-button>
    </form>
</section>
