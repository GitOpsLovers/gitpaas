<app-component-card title="Account">
    <div class="flex flex-wrap items-center gap-5">
        <span
            class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-brand-50 text-xl font-medium text-brand-500 dark:bg-brand-500/10 dark:text-brand-400"
            aria-hidden="true"
        >
            {{ initials() }}
        </span>

        <div class="min-w-0">
            <p
                class="truncate text-base font-medium"
                [class]="named() ? 'text-gray-800 dark:text-white/90' : 'text-gray-400 dark:text-gray-500'"
            >
                {{ name() }}
            </p>
            <p class="mt-1 truncate text-sm text-gray-500 dark:text-gray-400">{{ profile().email }}</p>

            <div class="mt-2.5 flex flex-wrap items-center gap-2">
                <span
                    class="inline-flex w-fit items-center rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400"
                >
                    {{ profile().role }}
                </span>

                @if (profile().totpEnabled) {
                    <span
                        class="inline-flex w-fit items-center rounded-full bg-success-50 px-2.5 py-0.5 text-xs font-medium text-success-600 dark:bg-success-500/15 dark:text-success-500"
                    >
                        Two-factor on
                    </span>
                }

                <span
                    class="inline-flex w-fit items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600 dark:bg-white/[0.05] dark:text-gray-300"
                >
                    Member since {{ profile().createdAt | date: 'yyyy-MM-dd' }}
                </span>
            </div>
        </div>
    </div>
</app-component-card>
