<section>
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Display name</h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">The name GitPaaS shows in place of your email address.</p>

    <form class="mt-5 space-y-6" (submit)="onSubmit($event)">
        <div class="max-w-md">
            <app-label for="profile-display-name">Display name</app-label>
            <app-input-field
                id="profile-display-name"
                name="profile-display-name"
                placeholder="Ada Lovelace"
                [value]="displayName()"
                [disabled]="saving()"
                [error]="lengthError() !== null"
                [hint]="lengthError() ?? 'Leave the field empty to show your email address instead.'"
                (valueChange)="onDisplayNameChange($event)"
            />
        </div>

        @if (error(); as message) {
            <p
                class="rounded-lg border border-error-200 bg-error-50 p-4 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-500"
            >
                {{ message }}
            </p>
        }

        <app-button type="submit" [disabled]="saving() || lengthError() !== null">
            {{ saving() ? 'Saving…' : 'Save' }}
        </app-button>
    </form>
</section>
