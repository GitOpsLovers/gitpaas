<app-breadcrumb [items]="breadcrumb()" />

<div class="mb-6 flex items-center justify-between gap-3">
    <p class="text-sm text-gray-500 dark:text-gray-400">Services in this project</p>
    <div class="flex items-center gap-3">
        <a
            [routerLink]="['/namespaces', namespaceId(), 'projects', id(), 'networks']"
            class="rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.03]"
        >
            Networks
        </a>
        <a
            [routerLink]="['/namespaces', namespaceId(), 'projects', id(), 'services', 'add']"
            class="rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600"
        >
            Add service
        </a>
    </div>
</div>

<app-services-list [namespaceId]="namespaceId()" [projectId]="id()" />
