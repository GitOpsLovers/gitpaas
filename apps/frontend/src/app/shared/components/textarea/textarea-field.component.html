<div>
    @if (label(); as labelText) {
        <app-label [for]="id()">{{ labelText }}</app-label>
    }

    <textarea
        [id]="id()"
        [name]="name()"
        [rows]="rows()"
        [attr.maxlength]="maxLength()"
        [placeholder]="placeholder()"
        [class]="
            'w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 ' +
            className()
        "
        [value]="value()"
        (input)="onInput($event)"
    ></textarea>

    <p class="mt-1.5 text-xs text-gray-500">{{ counter() }}</p>
</div>
