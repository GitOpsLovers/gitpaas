<button
    [type]="type()"
    [class]="
        'inline-flex items-center justify-center gap-2 rounded-lg transition ' +
        className() +
        ' ' +
        sizeClasses +
        ' ' +
        variantClasses +
        ' ' +
        disabledClasses
    "
    [disabled]="disabled()"
    (click)="onClick($event)"
>
    <ng-content></ng-content>
</button>
