@if (show()) {
    <div class="mx-auto mb-10 w-full max-w-60 rounded-2xl bg-gray-50 px-4 py-4 text-center dark:bg-white/[0.03]">
        <p class="text-gray-500 text-theme-sm dark:text-gray-400">GitPaaS {{ update().installedVersion }}</p>

        @if (update().available) {
            <a
                routerLink="/server/maintenance"
                class="mt-3 flex items-center justify-center gap-2 rounded-lg bg-brand-500 p-3 font-medium text-white text-theme-sm hover:bg-brand-600"
            >
                <svg lucideRocket class="size-4 shrink-0"></svg>
                Update to {{ update().latestVersion }}
            </a>
        }
    </div>
}
