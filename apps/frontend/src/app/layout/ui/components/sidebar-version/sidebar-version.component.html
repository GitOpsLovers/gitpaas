@if (show()) {
    <div class="flex shrink-0 flex-col items-start gap-1.5 border-t border-gray-200 px-3 py-3 dark:border-gray-800">
        <span
            class="inline-flex w-fit items-center rounded-sm bg-gray-100 px-1.5 py-0.5 text-theme-xs font-medium text-gray-600 dark:bg-white/[0.06] dark:text-gray-300"
        >
            GitPaaS {{ update().installedVersion }}
        </span>

        @if (update().available) {
            <a
                routerLink="/server/maintenance"
                class="inline-flex w-fit items-center gap-1.5 rounded-sm bg-brand-50 px-1.5 py-0.5 text-theme-xs font-medium text-brand-700 hover:bg-brand-100 dark:bg-brand-500/15 dark:text-brand-400 dark:hover:bg-brand-500/20"
            >
                <svg lucideRocket class="size-3.5 shrink-0"></svg>
                Update to {{ update().latestVersion }}
            </a>
        }
    </div>
}
