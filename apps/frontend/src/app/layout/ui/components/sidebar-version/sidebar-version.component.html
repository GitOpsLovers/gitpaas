@if (show()) {
    <div class="flex flex-col items-start gap-2 pb-6">
        <span
            class="inline-flex w-fit items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-600 dark:bg-white/[0.05] dark:text-gray-300"
        >
            GitPaaS {{ update().installedVersion }}
        </span>

        @if (update().available) {
            <a
                routerLink="/server/maintenance"
                class="inline-flex w-fit items-center gap-1.5 rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-medium text-brand-600 hover:bg-brand-100 dark:bg-brand-500/15 dark:text-brand-400 dark:hover:bg-brand-500/20"
            >
                <svg lucideRocket class="size-3.5 shrink-0"></svg>
                Update to {{ update().latestVersion }}
            </a>
        }
    </div>
}
