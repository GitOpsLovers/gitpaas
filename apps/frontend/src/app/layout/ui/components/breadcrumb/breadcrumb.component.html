<div class="mb-5 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <h2 class="flex items-center gap-2 text-theme-xl font-semibold tracking-tight text-gray-800 dark:text-white/90">
        @if (icon(); as sectionIcon) {
            <svg [lucideIcon]="sectionIcon" class="size-5 shrink-0 text-gray-400 dark:text-gray-500"></svg>
        }
        {{ current()?.label }}
    </h2>
    <nav aria-label="Breadcrumb">
        <ol class="flex flex-wrap items-center gap-1">
            <li>
                <a
                    class="inline-flex items-center gap-1 text-theme-xs font-medium text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
                    routerLink="/"
                >
                    Home
                    <svg lucideChevronRight class="size-3.5 text-gray-300 dark:text-gray-600"></svg>
                </a>
            </li>

            @for (item of items(); track $index; let last = $last) {
                <li class="inline-flex items-center gap-1">
                    @if (!last && item.link) {
                        <a
                            [routerLink]="item.link"
                            class="inline-flex items-center gap-1 text-theme-xs font-medium text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
                        >
                            {{ item.label }}
                        </a>
                        <svg lucideChevronRight class="size-3.5 text-gray-300 dark:text-gray-600"></svg>
                    } @else {
                        <span class="text-theme-xs font-medium text-gray-700 dark:text-gray-200">{{ item.label }}</span>
                    }
                </li>
            }
        </ol>
    </nav>
</div>
