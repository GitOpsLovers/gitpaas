<header
    class="sticky top-0 z-40 flex h-16 w-full shrink-0 border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
>
    <div class="flex grow items-center justify-between gap-3 px-4 lg:px-6">
        <div class="flex items-center gap-2.5">
            <!-- Sidebar toggler -->
            <button
                (click)="handleToggle()"
                class="flex size-9 items-center justify-center rounded-md border border-gray-200 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200"
                aria-label="Toggle sidebar"
            >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M3 6.75A.75.75 0 013.75 6h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 6.75zm0 5.25a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 12zm.75 4.5a.75.75 0 000 1.5h16.5a.75.75 0 000-1.5H3.75z"
                        fill="currentColor"
                    ></path>
                </svg>
            </button>

            <span class="text-theme-sm font-semibold tracking-tight text-gray-800 xl:hidden dark:text-white/90">
                GitPaaS
            </span>
        </div>

        <div class="flex items-center gap-2">
            <app-theme-toggle-button />

            <div class="relative">
                <button
                    type="button"
                    (click)="toggleUserMenu()"
                    [attr.aria-expanded]="isUserMenuOpen()"
                    aria-haspopup="menu"
                    class="flex h-9 items-center gap-2 rounded-md border border-gray-200 pr-2.5 pl-1 text-gray-700 transition-colors hover:bg-gray-100 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-gray-800"
                    aria-label="User menu"
                >
                    <span
                        class="flex size-7 shrink-0 items-center justify-center rounded-sm bg-brand-50 text-theme-xs font-semibold text-brand-700 dark:bg-brand-500/15 dark:text-brand-300"
                        aria-hidden="true"
                    >
                        @if (currentUser()) {
                            {{ initials() }}
                        } @else {
                            <svg lucideUserRound class="size-4"></svg>
                        }
                    </span>
                    <span class="hidden max-w-40 truncate text-theme-sm font-medium sm:block">{{ name() }}</span>
                </button>

                @if (isUserMenuOpen()) {
                    <div
                        role="menu"
                        class="absolute right-0 z-40 mt-1.5 w-56 rounded-lg border border-gray-200 bg-white p-1.5 shadow-theme-lg dark:border-gray-800 dark:bg-gray-900"
                    >
                        <div class="border-b border-gray-200 px-2.5 pt-1.5 pb-2.5 dark:border-gray-800">
                            <p class="truncate text-theme-sm font-medium text-gray-800 dark:text-white/90">
                                {{ name() }}
                            </p>
                            @if (email(); as address) {
                                <p class="mt-0.5 truncate text-theme-xs text-gray-500 dark:text-gray-400">
                                    {{ address }}
                                </p>
                            }
                        </div>

                        <a
                            routerLink="/profile"
                            (click)="closeUserMenu()"
                            role="menuitem"
                            class="mt-1.5 flex w-full items-center gap-2 rounded-md px-2.5 py-1.5 text-theme-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/[0.06]"
                        >
                            <svg lucideUserRound class="size-4"></svg>
                            Profile
                        </a>

                        <button
                            type="button"
                            (click)="logout()"
                            role="menuitem"
                            class="flex w-full items-center gap-2 rounded-md px-2.5 py-1.5 text-theme-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/[0.06]"
                        >
                            <svg lucideLogOut class="size-4"></svg>
                            Log out
                        </button>
                    </div>
                }
            </div>
        </div>
    </div>
</header>
